name: Code Checks

on:
  workflow_dispatch:

jobs:
  pwa-checks:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./pwa

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/setup@v3
        with:
          version: ^12.0.0
          runtime: node@22
          cache: true
          install: true

      - name: Run lint
        run: pnpm lint

  backend-checks:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true
          cache-dependency-path: "./backend/go.sum"

      - name: Run Go vet
        run: go vet

      - name: Check Go formatting
        run: gofmt -l

      - name: Test
        run: make test
